<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 180">
  <defs>
    <linearGradient id="barFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500"/>
      <stop offset="30%" style="stop-color:#FF6B00"/>
      <stop offset="70%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="barShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#FFFFFF;stop-opacity:0.3"/>
      <stop offset="70%" style="stop-color:#FFFFFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    <filter id="barGlow" x="-20%" y="-5%" width="140%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background track -->
  <rect x="4" y="4" width="40" height="172" rx="16" ry="16" fill="#1A0A0A" opacity="0.8"/>
  <!-- Inner border -->
  <rect x="4" y="4" width="40" height="172" rx="16" ry="16" fill="none" stroke="#4A2020" stroke-width="2"/>
</svg>
