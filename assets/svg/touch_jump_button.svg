<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Jump button - transparent dark circle with up arrow -->
  <defs>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#404050;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#202030;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="60" fill="url(#buttonGrad)" stroke="#606080" stroke-width="3" stroke-opacity="0.5"/>
  <!-- Up arrow -->
  <path d="M64 30 L44 58 L54 58 L54 90 L74 90 L74 58 L84 58 Z" fill="#ffffff" fill-opacity="0.8"/>
</svg>
