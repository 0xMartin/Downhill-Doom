<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Joystick knob - draggable thumb -->
  <defs>
    <radialGradient id="knobGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#606080;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#303040;stop-opacity:0.95"/>
    </radialGradient>
  </defs>
  <!-- Main knob -->
  <circle cx="40" cy="40" r="36" fill="url(#knobGrad)" stroke="#808090" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Highlight -->
  <circle cx="32" cy="32" r="10" fill="#ffffff" fill-opacity="0.15"/>
</svg>
