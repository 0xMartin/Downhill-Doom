<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 16">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Center diamond -->
  <polygon points="100,2 106,8 100,14 94,8" fill="#FFFFFF"/>
  <!-- Left line -->
  <line x1="10" y1="8" x2="90" y2="8" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <!-- Right line -->
  <line x1="110" y1="8" x2="190" y2="8" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <!-- Small diamonds -->
  <polygon points="70,5 73,8 70,11 67,8" fill="#FFFFFF" opacity="0.5"/>
  <polygon points="130,5 133,8 130,11 127,8" fill="#FFFFFF" opacity="0.5"/>
</svg>
