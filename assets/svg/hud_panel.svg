<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 60">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.95"/>
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Main panel -->
  <rect x="2" y="2" width="676" height="56" rx="14" ry="14" fill="url(#panelGrad)"/>
  <!-- Border accent -->
  <rect x="2" y="2" width="676" height="56" rx="14" ry="14" fill="none" stroke="url(#borderGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Inner highlight -->
  <rect x="6" y="6" width="668" height="20" rx="10" ry="10" fill="rgba(255,255,255,0.03)"/>
  <!-- Decorative corner accents -->
  <path d="M16 2 L2 2 L2 16" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M664 2 L678 2 L678 16" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
