<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
  <!-- Speed lines from edges towards center - solid white with varying opacity -->
  <!-- Left side -->
  <line x1="0" y1="100" x2="200" y2="300" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="0" y1="250" x2="180" y2="420" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="0" y1="400" x2="150" y2="520" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="0" y1="600" x2="160" y2="640" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="0" y1="800" x2="170" y2="760" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="0" y1="950" x2="150" y2="870" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="0" y1="1100" x2="180" y2="980" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="0" y1="1200" x2="200" y2="1050" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- Right side -->
  <line x1="720" y1="150" x2="520" y2="320" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="720" y1="300" x2="540" y2="440" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="720" y1="500" x2="560" y2="560" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="720" y1="700" x2="550" y2="680" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="720" y1="850" x2="540" y2="810" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="720" y1="1000" x2="520" y2="920" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="720" y1="1150" x2="550" y2="1020" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Top corners -->
  <line x1="100" y1="0" x2="280" y2="200" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="620" y1="0" x2="440" y2="200" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Bottom corners -->
  <line x1="80" y1="1280" x2="260" y2="1080" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="640" y1="1280" x2="460" y2="1080" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
