<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Joystick base - transparent dark circular track -->
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#303040;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#181820;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#baseGrad)" stroke="#505060" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Inner guiding ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#404050" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Left-right arrows indicator -->
  <path d="M30 100 L50 85 L50 115 Z" fill="#ffffff" fill-opacity="0.25"/>
  <path d="M170 100 L150 85 L150 115 Z" fill="#ffffff" fill-opacity="0.25"/>
</svg>
