<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Simple white checklist/quest icon -->
  <!-- Main scroll body -->
  <rect x="20" y="14" width="56" height="68" rx="6" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- Top curl line -->
  <path d="M20 20 Q48 8 76 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- Checkbox 1 - checked -->
  <rect x="28" y="30" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
  <polyline points="31,37 35,41 43,31" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="48" y="34" width="22" height="5" rx="2" fill="#fff"/>
  <!-- Checkbox 2 - empty -->
  <rect x="28" y="50" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="48" y="54" width="18" height="5" rx="2" fill="#fff" opacity="0.7"/>
  <!-- Checkbox 3 - empty -->
  <rect x="28" y="70" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="48" y="74" width="14" height="5" rx="2" fill="#fff" opacity="0.5"/>
</svg>
