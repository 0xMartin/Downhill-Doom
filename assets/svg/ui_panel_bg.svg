<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 336">
  <defs>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A1025"/>
      <stop offset="50%" style="stop-color:#2A1B3D"/>
      <stop offset="100%" style="stop-color:#1A1025"/>
    </linearGradient>
    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B4FA0"/>
      <stop offset="50%" style="stop-color:#4A3570"/>
      <stop offset="100%" style="stop-color:#6B4FA0"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-5%" width="120%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Main panel shape -->
  <rect x="4" y="4" width="76" height="328" rx="24" ry="24" fill="url(#panelGradient)" filter="url(#panelShadow)"/>
  <!-- Border -->
  <rect x="4" y="4" width="76" height="328" rx="24" ry="24" fill="none" stroke="url(#panelBorder)" stroke-width="2"/>
  <!-- Inner decorative frame -->
  <rect x="10" y="10" width="64" height="316" rx="20" ry="20" fill="none" stroke="#4A3570" stroke-width="1" opacity="0.5"/>
  <!-- Top highlight -->
  <rect x="20" y="8" width="44" height="2" rx="1" fill="#9B7ED9" opacity="0.4"/>
  <!-- Bottom highlight -->
  <rect x="20" y="326" width="44" height="2" rx="1" fill="#9B7ED9" opacity="0.3"/>
</svg>
