<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">
  <defs>
    <!-- Golden gradient for frame -->
    <linearGradient id="gold_frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE566"/>
      <stop offset="30%" style="stop-color:#FFD700"/>
      <stop offset="70%" style="stop-color:#DAA520"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <!-- Inner shadow gradient -->
    <linearGradient id="shadow_top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="shadow_bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.6"/>
    </linearGradient>
    <!-- Side fade gradients -->
    <linearGradient id="fade_left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1420;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D1420;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="fade_right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1420;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0D1420;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Main frame border -->
  <rect x="0" y="0" width="520" height="160" rx="12" fill="none" stroke="url(#gold_frame)" stroke-width="4"/>
  
  <!-- Inner decorative border -->
  <rect x="6" y="6" width="508" height="148" rx="8" fill="none" stroke="url(#gold_frame)" stroke-width="1" opacity="0.5"/>
  
  <!-- Corner decorations -->
  <circle cx="16" cy="16" r="6" fill="url(#gold_frame)"/>
  <circle cx="504" cy="16" r="6" fill="url(#gold_frame)"/>
  <circle cx="16" cy="144" r="6" fill="url(#gold_frame)"/>
  <circle cx="504" cy="144" r="6" fill="url(#gold_frame)"/>
  
  <!-- Side fade overlays -->
  <rect x="0" y="0" width="60" height="160" fill="url(#fade_left)"/>
  <rect x="460" y="0" width="60" height="160" fill="url(#fade_right)"/>
  
  <!-- Top/bottom vignette -->
  <rect x="0" y="0" width="520" height="30" fill="url(#shadow_top)"/>
  <rect x="0" y="130" width="520" height="30" fill="url(#shadow_bottom)"/>
</svg>
