<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="powerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2200;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="powerGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffee66;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
    </filter>
  </defs>
  <!-- Outer glow -->
  <g filter="url(#softGlow)" opacity="0.6">
    <polygon points="32,10 12,34 22,34 32,20 42,34 52,34" fill="#ff6600"/>
    <polygon points="32,28 12,52 22,52 32,38 42,52 52,52" fill="#ff4400"/>
  </g>
  <!-- Top chevron (brightest) -->
  <polygon points="32,8 10,34 21,34 32,18 43,34 54,34" 
           fill="url(#powerGrad2)" filter="url(#glow)"/>
  <!-- Bottom chevron -->
  <polygon points="32,26 10,52 21,52 32,36 43,52 54,52" 
           fill="url(#powerGrad)" filter="url(#glow)"/>
  
</svg>
