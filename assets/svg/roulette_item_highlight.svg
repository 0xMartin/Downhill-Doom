<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="highlight_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE566"/>
      <stop offset="25%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="75%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFE566"/>
    </linearGradient>
    <filter id="glow_filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow -->
  <rect x="4" y="4" width="88" height="88" rx="12" fill="none" stroke="#FFD700" stroke-width="6" opacity="0.3" filter="url(#glow_filter)"/>
  
  <!-- Main highlight border -->
  <rect x="2" y="2" width="92" height="92" rx="12" fill="none" stroke="url(#highlight_border)" stroke-width="4"/>
  
  <!-- Inner shine -->
  <rect x="6" y="6" width="84" height="84" rx="10" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
</svg>
