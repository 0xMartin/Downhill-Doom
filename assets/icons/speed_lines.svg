<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32">
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#fff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Speed/motion lines -->
  <line x1="5" y1="8" x2="45" y2="8" stroke="url(#speedGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="55" y2="16" stroke="url(#speedGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="5" y1="24" x2="45" y2="24" stroke="url(#speedGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
