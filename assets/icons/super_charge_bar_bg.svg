<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 200">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a05;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d0502;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a05;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6633;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff3300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6633;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <!-- Outer glow border -->
  <rect x="1" y="1" width="58" height="198" rx="16" ry="16" fill="none" stroke="url(#borderGlow)" stroke-width="2"/>
  <!-- Main background -->
  <rect x="4" y="4" width="52" height="192" rx="14" ry="14" fill="url(#barBg)"/>
  <!-- Inner shadow -->
  <rect x="6" y="6" width="48" height="188" rx="12" ry="12" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Side accents -->
  <rect x="8" y="20" width="2" height="160" rx="1" ry="1" fill="#ff3300" fill-opacity="0.3"/>
  <rect x="50" y="20" width="2" height="160" rx="1" ry="1" fill="#ff3300" fill-opacity="0.3"/>
</svg>
