<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <filter id="sparkleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 4-point star sparkle -->
  <path d="M16 2 L18 12 L28 14 L18 16 L16 26 L14 16 L4 14 L14 12 Z" 
        fill="url(#sparkleGrad)" filter="url(#sparkleGlow)"/>
  <!-- Small diamonds -->
  <path d="M6 6 L7 8 L6 10 L5 8 Z" fill="#fff" opacity="0.8"/>
  <path d="M26 22 L27 24 L26 26 L25 24 Z" fill="#fff" opacity="0.8"/>
</svg>
